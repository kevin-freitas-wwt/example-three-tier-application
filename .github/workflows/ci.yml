name: CI

on:
    pull_request:
        types: [opened, synchronize, reopened]
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

defaults:
    run:
        shell: bash

jobs:
    web:
        name: Web build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: src/web
        env:
            NEXT_TELEMETRY_DISABLED: "1"
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: src/web/package-lock.json
            - name: Install dependencies
              run: ../../.github/scripts/run-step.sh npm ci --no-audit --no-fund
            - name: Lint
              run: ../../.github/scripts/run-step.sh npm run lint
            - name: Build
              run: ../../.github/scripts/run-step.sh npm run build

    api:
        name: API checks
        runs-on: ubuntu-latest
        timeout-minutes: 5
        defaults:
            run:
                working-directory: src/api
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: src/api/package-lock.json
            - name: Install dependencies
              run: ../../.github/scripts/run-step.sh npm ci --no-audit --no-fund
            - name: Syntax check
              run: ../../.github/scripts/run-step.sh node --check index.js db.js
            - name: Smoke test
              run: ../../.github/scripts/run-step.sh npm test

    db:
        name: DB migrations check
        runs-on: ubuntu-latest
        timeout-minutes: 5
        defaults:
            run:
                working-directory: src/db
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: src/db/package-lock.json
            - name: Install dependencies
              run: ../../.github/scripts/run-step.sh npm ci --no-audit --no-fund
            - name: Syntax check
              run: ../../.github/scripts/run-step.sh find migrations -name '*.js' -exec node --check {} +
