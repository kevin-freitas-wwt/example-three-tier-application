<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="success-t">
  <title id="success-t">Success illustration: a plate with a checkmark badge, an open cloche lid and celebratory AI sparks</title>
  <defs>
    <linearGradient id="success-dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#D9363E"/>
    </linearGradient>
    <linearGradient id="success-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FB871"/>
      <stop offset="1" stop-color="#2E9B5C"/>
    </linearGradient>
  </defs>

  <!-- table -->
  <rect x="40" y="236" width="320" height="14" rx="7" fill="#F3C9A5"/>
  <rect x="60" y="250" width="280" height="10" rx="5" fill="#E7B98D"/>

  <!-- plate -->
  <ellipse cx="200" cy="222" rx="118" ry="20" fill="#FFF7EE"/>

  <!-- cutlery -->
  <rect x="56" y="206" width="8" height="40" rx="4" fill="#D9363E"/>
  <rect x="336" y="206" width="8" height="40" rx="4" fill="#D9363E"/>

  <!-- cloche lid popped open to the side, happy result -->
  <g transform="translate(90 100) rotate(18)">
    <path d="M-80 84a80 80 0 0 1 160 0z" fill="url(#success-dome)"/>
    <circle cx="0" cy="-14" r="10" fill="url(#success-dome)"/>
    <rect x="-90" y="80" width="180" height="15" rx="7.5" fill="url(#success-dome)"/>
  </g>

  <!-- success badge on the plate -->
  <circle cx="226" cy="190" r="46" fill="url(#success-badge)"/>
  <path d="M204 190l14 14 28-32" stroke="#FFF7EE" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- celebratory sparks -->
  <path d="M310 80l9 22 22 9-22 9-9 22-9-22-22-9 22-9z" fill="#FF7A45"/>
  <path d="M330 150l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#D9363E"/>
  <path d="M90 60l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#FF7A45"/>
</svg>
