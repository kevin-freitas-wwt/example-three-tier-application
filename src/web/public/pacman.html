<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pac-Man Screen</title>
<style>
  :root {
    --cell: 32px;
    --board-w: 15;
    --board-h: 9;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", Courier, monospace;
  }

  .arcade {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .title {
    color: #ffff00;
    font-size: 2.5rem;
    letter-spacing: 0.3em;
    text-shadow: 0 0 8px #ffcc00, 0 0 16px #ff6600;
  }

  .board {
    position: relative;
    width: calc(var(--cell) * var(--board-w));
    height: calc(var(--cell) * var(--board-h));
    background: #000;
    border: 6px solid #2121de;
    border-radius: 8px;
    box-shadow:
      inset 0 0 0 4px #000,
      inset 0 0 0 8px #2121de,
      0 0 20px #2121de;
    overflow: hidden;
  }

  /* Dotted path pac-man travels along */
  .dots {
    position: absolute;
    top: calc(var(--cell) * 4 + var(--cell) / 2 - 3px);
    left: 0;
    width: 100%;
    height: 6px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 var(--cell);
    box-sizing: border-box;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffb8ae;
  }

  /*
   * Each dot uses the same 6s duration as Pac-Man's travel animation
   * (see .pacman / @keyframes travel) and no animation-delay, so every
   * loop starts in sync: all dots are visible at 0% and disappear at
   * the percentage of the 6s cycle when Pac-Man's mouth actually
   * reaches that dot's horizontal position on the 480px board.
   */
  .dot:nth-child(1)  { animation: chomp-dot-1  6s linear infinite; }
  .dot:nth-child(2)  { animation: chomp-dot-2  6s linear infinite; }
  .dot:nth-child(3)  { animation: chomp-dot-3  6s linear infinite; }
  .dot:nth-child(4)  { animation: chomp-dot-4  6s linear infinite; }
  .dot:nth-child(5)  { animation: chomp-dot-5  6s linear infinite; }
  .dot:nth-child(6)  { animation: chomp-dot-6  6s linear infinite; }
  .dot:nth-child(7)  { animation: chomp-dot-7  6s linear infinite; }
  .dot:nth-child(8)  { animation: chomp-dot-8  6s linear infinite; }
  .dot:nth-child(9)  { animation: chomp-dot-9  6s linear infinite; }
  .dot:nth-child(10) { animation: chomp-dot-10 6s linear infinite; }

  @keyframes chomp-dot-1  { 0%, 14% { opacity: 1; } 15%, 100% { opacity: 0; } }
  @keyframes chomp-dot-2  { 0%, 21% { opacity: 1; } 22%, 100% { opacity: 0; } }
  @keyframes chomp-dot-3  { 0%, 29% { opacity: 1; } 30%, 100% { opacity: 0; } }
  @keyframes chomp-dot-4  { 0%, 36% { opacity: 1; } 37%, 100% { opacity: 0; } }
  @keyframes chomp-dot-5  { 0%, 44% { opacity: 1; } 45%, 100% { opacity: 0; } }
  @keyframes chomp-dot-6  { 0%, 51% { opacity: 1; } 52%, 100% { opacity: 0; } }
  @keyframes chomp-dot-7  { 0%, 58% { opacity: 1; } 59%, 100% { opacity: 0; } }
  @keyframes chomp-dot-8  { 0%, 66% { opacity: 1; } 67%, 100% { opacity: 0; } }
  @keyframes chomp-dot-9  { 0%, 73% { opacity: 1; } 74%, 100% { opacity: 0; } }
  @keyframes chomp-dot-10 { 0%, 81% { opacity: 1; } 82%, 100% { opacity: 0; } }

  /* Pac-Man */
  .pacman {
    position: absolute;
    top: calc(var(--cell) * 4 + var(--cell) / 2 - 14px);
    left: -32px;
    width: 28px;
    height: 28px;
    animation: travel 6s linear infinite;
  }

  .pacman .top,
  .pacman .bottom {
    position: absolute;
    width: 28px;
    height: 14px;
    background: #ffff00;
  }

  .pacman .top {
    top: 0;
    border-radius: 28px 28px 0 0;
    animation: mouth-top 0.3s ease-in-out infinite;
    transform-origin: bottom left;
  }

  .pacman .bottom {
    bottom: 0;
    border-radius: 0 0 28px 28px;
    animation: mouth-bottom 0.3s ease-in-out infinite;
    transform-origin: top left;
  }

  @keyframes mouth-top {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-35deg); }
  }

  @keyframes mouth-bottom {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(35deg); }
  }

  @keyframes travel {
    0% { left: -32px; }
    100% { left: calc(100% + 4px); }
  }

  /* Ghosts */
  .ghost {
    position: absolute;
    top: calc(var(--cell) * 4 + var(--cell) / 2 - 14px);
    left: -60px;
    width: 26px;
    height: 26px;
    animation: travel 6s linear infinite;
  }

  .ghost .body {
    position: relative;
    width: 26px;
    height: 20px;
    border-radius: 13px 13px 0 0;
  }

  .ghost .feet {
    display: flex;
    height: 6px;
  }

  .ghost .feet span {
    flex: 1;
    background: inherit;
  }

  .ghost .feet span:nth-child(1) { border-radius: 0 0 6px 6px; }
  .ghost .feet span:nth-child(2) { border-radius: 0 0 0 6px; margin-top: 3px; }
  .ghost .feet span:nth-child(3) { border-radius: 0 0 6px 0; }

  .ghost .eyes {
    position: absolute;
    top: 5px;
    left: 4px;
    width: 18px;
    display: flex;
    justify-content: space-between;
  }

  .ghost .eyes span {
    width: 6px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    position: relative;
  }

  .ghost .eyes span::after {
    content: "";
    position: absolute;
    width: 3px;
    height: 3px;
    background: #2121de;
    border-radius: 50%;
    top: 2px;
    left: 2px;
  }

  .ghost.red .body, .ghost.red .feet span { background: #ff0000; }
  .ghost.pink .body, .ghost.pink .feet span { background: #ffb8ff; }
  .ghost.cyan .body, .ghost.cyan .feet span { background: #00ffff; }
  .ghost.orange .body, .ghost.orange .feet span { background: #ffb851; }

  .ghost.red { animation-delay: 1s; }
  .ghost.pink { animation-delay: 2s; }
  .ghost.cyan { animation-delay: 3s; }
  .ghost.orange { animation-delay: 4s; }

  .score {
    color: #ffffff;
    font-size: 1.1rem;
  }

  .score span {
    color: #00ffff;
  }
</style>
</head>
<body>
  <div class="arcade">
    <div class="title">PAC-MAN</div>
    <div class="board">
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="pacman">
        <div class="top"></div>
        <div class="bottom"></div>
      </div>

      <div class="ghost red">
        <div class="body"></div>
        <div class="feet"><span></span><span></span><span></span></div>
        <div class="eyes"><span></span><span></span></div>
      </div>

      <div class="ghost pink">
        <div class="body"></div>
        <div class="feet"><span></span><span></span><span></span></div>
        <div class="eyes"><span></span><span></span></div>
      </div>

      <div class="ghost cyan">
        <div class="body"></div>
        <div class="feet"><span></span><span></span><span></span></div>
        <div class="eyes"><span></span><span></span></div>
      </div>

      <div class="ghost orange">
        <div class="body"></div>
        <div class="feet"><span></span><span></span><span></span></div>
        <div class="eyes"><span></span><span></span></div>
      </div>
    </div>
    <div class="score">SCORE <span>00</span> &nbsp; HIGH SCORE <span>00</span></div>
  </div>
</body>
</html>
