<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google</title>
<style>
  body {
    background-color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10pt;
    margin: 0;
    padding: 0;
    color: #000000;
  }
  a {
    color: #0000cc;
    text-decoration: none;
  }
  a:visited {
    color: #551a8b;
  }
  a:hover {
    text-decoration: underline;
  }
  .top-links {
    text-align: right;
    padding: 4px 8px 0 0;
    font-size: 10pt;
  }
  .top-links a {
    margin-left: 12px;
  }
  .logo-wrap {
    text-align: center;
    margin-top: 60px;
  }
  .logo {
    font-family: Times New Roman, Times, serif;
    font-size: 72px;
    font-weight: bold;
    letter-spacing: -2px;
  }
  .g-blue { color: #3366cc; }
  .g-red { color: #cc3333; }
  .g-yellow { color: #dcb400; }
  .g-green { color: #339933; }

  .search-wrap {
    text-align: center;
    margin-top: 15px;
  }
  .search-box {
    width: 330px;
    height: 20px;
    border: 1px solid #999999;
    font-size: 11pt;
    padding: 2px;
  }
  .buttons {
    text-align: center;
    margin-top: 15px;
  }
  .buttons input {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10pt;
    background-color: #f3f3f3;
    border: 1px solid #999999;
    padding: 4px 12px;
    margin: 0 4px;
    cursor: pointer;
  }
  .categories {
    text-align: center;
    margin-top: 20px;
    font-size: 10pt;
  }
  .below {
    text-align: center;
    margin-top: 40px;
    font-size: 10pt;
    color: #666666;
  }
  hr.thin {
    border: none;
    border-top: 1px solid #cccccc;
    width: 40%;
    margin: 20px auto 0 auto;
  }
  .footer {
    text-align: center;
    margin-top: 15px;
    font-size: 10pt;
    color: #333333;
    padding-bottom: 30px;
  }
  .footer a {
    margin: 0 8px;
  }
  .copyright {
    text-align: center;
    font-size: 9pt;
    color: #666666;
    padding-bottom: 20px;
  }
</style>
</head>
<body>

  <div class="top-links">
    <a href="#">Advanced Search</a>
    <a href="#">Preferences</a>
    <a href="#">Language Tools</a>
  </div>

  <div class="logo-wrap">
    <span class="logo">
      <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span><span class="g-yellow">!</span>
    </span>
  </div>

  <div class="search-wrap">
    <form action="#" onsubmit="return false;">
      <input type="text" class="search-box" name="q">
    </form>
  </div>

  <div class="buttons">
    <input type="submit" value="Google Search">
    <input type="submit" value="I'm Feeling Lucky">
  </div>

  <div class="categories">
    <a href="#">Web</a> &nbsp;|&nbsp;
    <a href="#">Images</a> &nbsp;|&nbsp;
    <a href="#">Directory</a> &nbsp;|&nbsp;
    <a href="#">Groups</a>
  </div>

  <hr class="thin">

  <div class="below">
    <a href="#">Company Info</a> |
    <a href="#">Add URL, Remove URL</a> |
    <a href="#">Advertise with Us!</a> |
    <a href="#">Search Tips</a> |
    <a href="#">Language Tools</a>
  </div>

  <div class="footer">
    &copy;1998 Google Inc.
  </div>

</body>
</html>
